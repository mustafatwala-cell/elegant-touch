<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المفضلة | Elegant Touch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--rose:#b3355a;--rose-dark:#8f2646;--blush:#fdf1f0;--cream:#fffaf7;--ink:#221f1d;--muted:#8a8078;--line:#f0e2df;--card-bg:#fff;--text-on-card:#221f1d}
*{box-sizing:border-box}
body{font-family:Tajawal,sans-serif;background:var(--cream);color:var(--ink);transition:background .3s,color .3s}
.product-card{background:var(--card-bg);color:var(--text-on-card);border-radius:14px;overflow:hidden;border:1px solid var(--line);transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column}
.product-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
.product-card .card-img{aspect-ratio:3/4;overflow:hidden;position:relative;background:var(--blush)}
.product-card .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.product-card:hover .card-img img{transform:scale(1.07)}
.product-card .card-body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.product-card .card-name{font-size:15px;font-weight:500}
.product-card .card-price{font-size:16px;font-weight:700;color:var(--rose)}
.product-card .card-btn{margin-top:auto;padding:10px 14px;border-radius:999px;background:var(--ink);color:#fff !important;font-weight:700;font-size:13px;cursor:pointer;border:none}
.product-card .card-btn:hover{background:var(--rose)}
body.dark{--cream:#1a1816;--ink:#f5f0ed;--blush:#2a2523;--line:#3a3330;--muted:#a89f98;--card-bg:#221f1d;--text-on-card:#f5f0ed;--rose:#e06b8b;--rose-dark:#c14b6f}
body.dark nav{background:#221f1d !important;border-color:#3a3330 !important}
body.dark .product-card .card-btn{background:var(--rose);color:#fff !important}
body.dark img{filter:brightness(.92)}
.whatsapp-float{position:fixed;bottom:20px;left:20px;z-index:55;display:flex;align-items:center;gap:8px;background:#25D366;color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(37,211,102,.4);text-decoration:none}
@media(max-width:640px){.whatsapp-float span{display:none}.whatsapp-float{padding:14px;border-radius:50%}}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
@media(max-width:480px){.fav-grid{grid-template-columns:repeat(2,1fr);gap:12px}}
</style>
</head>
<body>
<div class="text-center text-sm py-2 text-white" style="background:var(--rose-dark)">توصيل لجميع المحافظات · اطلبي الآن مباشرة عبر واتساب</div>
<nav class="sticky top-0 z-10 border-b" style="background:var(--card-bg);border-color:var(--line)">
  <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
    <a href="index.html" class="font-bold text-sm">← رجوع للمتجر</a>
    <a href="index.html" class="text-2xl font-extrabold" style="color:var(--rose)">Elegant Touch</a>
    <span class="text-sm">المفضلة ♥</span>
  </div>
</nav>
<main class="max-w-6xl mx-auto px-5 py-10">
  <h1 class="text-3xl font-extrabold mb-8 text-center">منتجاتك المفضلة</h1>
  <div id="fav-grid" class="fav-grid"></div>
  <div id="empty" class="hidden text-center py-20">
    <div class="text-6xl mb-4" style="color:var(--rose)">♡</div>
    <h2 class="text-2xl font-bold mb-2">مفيش منتجات في المفضلة</h2>
    <p style="color:var(--muted)" class="mb-6">ابدأي بإضافة المنتجات اللي عجبتك</p>
    <a href="index.html" class="inline-block py-3 px-8 rounded-full text-white font-bold" style="background:var(--rose)">تسوقي الآن</a>
  </div>
</main>
<a href="https://wa.me/201557637446" target="_blank" class="whatsapp-float" aria-label="واتساب">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592z"/></svg>
  <span>WhatsApp</span>
</a>
<script src="products.js"></script>
<script>
let favorites = JSON.parse(localStorage.getItem('et_favorites') || '[]');
if(localStorage.getItem('et_dark') === '1') document.body.classList.add('dark');
function renderFavs(){
  const favProds = products.filter(p => favorites.includes(p.id));
  const grid = document.getElementById('fav-grid');
  const empty = document.getElementById('empty');
  if(!favProds.length){ grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  grid.innerHTML = favProds.map(p => `
    <div class="product-card">
      <div class="card-img cursor-pointer" onclick="location.href='product.html?id=${p.id}'">
        <button class="absolute top-2 left-2 w-9 h-9 rounded-full bg-white/90 flex items-center justify-center z-10" onclick="event.stopPropagation();removeFav(${p.id})" aria-label="حذف من المفضلة" style="color:var(--rose);border:none;cursor:pointer">♥</button>
        <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x400/fdf1f0/b3355a?text=Elegant'">
      </div>
      <div class="card-body">
        <h3 class="card-name">${p.name}</h3>
        <p class="card-price">${p.price} ج.م</p>
        <button onclick="location.href='product.html?id=${p.id}'" class="card-btn">عرض التفاصيل</button>
      </div>
    </div>
  `).join('');
}
function removeFav(id){
  favorites = favorites.filter(x => x !== id);
  localStorage.setItem('et_favorites', JSON.stringify(favorites));
  renderFavs();
}
renderFavs();
</script>
</body>
</html>
